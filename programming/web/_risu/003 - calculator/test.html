<!DOCTYPE html>
<html>

<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="test.css">
</head>

<body>
    <h2>calculator</h2>
    <input id="input">
    <table>
        <tr>
            <td>
                <button class="special input" value="(">(</button>
            </td>
            <td>
                <button class="special input" value=")">)</button>
            </td>
            <td>
                <button class="special input" value="^">x^y</button>
            </td>
            <td>
                <button class="special input" value="/">/</button>
            </td>
        </tr>
        <tr>
            <td>
                <button class="number input" value="7">7</button>
            </td>
            <td>
                <button class="number input" value="8">8</button>
            </td>
            <td>
                <button class="number input" value="9">9</button>
            </td>
            <td>
                <button class="special input" value="*">*</button>
            </td>
        </tr>
        <tr>
            <td>
                <button class="number input" value="4">4</button>
            </td>
            <td>
                <button class="number input" value="5">5</button>
            </td>
            <td>
                <button class="number input" value="6">6</button>
            </td>
            <td>
                <button class="special input" value="-">-</button>
            </td>
        </tr>
        <tr>
            <td>
                <button class="number input" value="1">1</button>
            </td>
            <td>
                <button class="number input" value="2">2</button>
            </td>
            <td>
                <button class="number input" value="3">3</button>
            </td>
            <td>
                <button class="special input" value="+">+</button>
            </td>
        </tr>
        <tr>
            <td>
                <button class="special input delete" value="ce">ce</button>
            </td>
            <td>
                <button class="number input" value="0">0</button>
            </td>
            <td>
                <button class="special input" value=".">.</button>
            </td>
            <td>
                <button class="equals input" value="=">=</button>
            </td>
        </tr>
    </table>
    <script type="module" src="./test.js"></script>
</body>

</html>
